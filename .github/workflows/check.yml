name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    # Checks that can run on a standard hosted runner. Browser and GPU tests need a physical
    # graphics device and are run locally (docs/TESTING.md); a green run does not cover them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint (type checks)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package and audit the release files
        run: npm run package
      - name: Dependency audit
        run: npm audit
      - name: Record what this run did not cover
        if: always()
        run: |
          {
            echo "### Not covered by this workflow"
            echo "Browser tests (npm run test:browser), the GPU matrix (npm run test:gpu),"
            echo "verify:release and verify:source need a local machine with a graphics device."
          } >> "$GITHUB_STEP_SUMMARY"
