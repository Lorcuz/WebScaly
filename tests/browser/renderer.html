<!doctype html>
<html>
  <head>
    <title>WebScaly renderer harness</title>
    <style>
      body {
        margin: 16px;
        background: #10171f;
        color: white;
        font: 14px system-ui;
      }
      .player {
        position: relative;
        width: 960px;
      }
      video {
        width: 100%;
        display: block;
      }
      .player:fullscreen {
        width: 100%;
        background: black;
      }
      .player:fullscreen video {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="player"><video muted playsinline></video></div>
    <button id="fullscreen-video">Video element fullscreen</button>
    <button id="fullscreen-player">Player fullscreen</button>
    <script type="module" src="./renderer-harness.ts"></script>
  </body>
</html>
